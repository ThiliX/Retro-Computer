<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140616"/>
      <stop offset="0.35" stop-color="#3a0f2e"/>
      <stop offset="0.6" stop-color="#8c1c3a"/>
      <stop offset="0.72" stop-color="#e8352b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ffb627"/>
      <stop offset="0.75" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#e8352b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a22"/>
      <stop offset="1" stop-color="#0e0610"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sunClip">
      <rect x="0" y="0" width="800" height="372"/>
    </clipPath>
    <mask id="sunStripes">
      <rect x="0" y="0" width="800" height="600" fill="#fff"/>
      <rect x="0" y="300" width="800" height="4" fill="#000"/>
      <rect x="0" y="316" width="800" height="6" fill="#000"/>
      <rect x="0" y="334" width="800" height="8" fill="#000"/>
      <rect x="0" y="352" width="800" height="10" fill="#000"/>
    </mask>
  </defs>

  <rect width="800" height="372" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#ffe8c2">
    <circle cx="80" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="190" cy="110" r="1" opacity="0.6"/>
    <circle cx="300" cy="40" r="1.4" opacity="0.9"/>
    <circle cx="460" cy="80" r="1" opacity="0.7"/>
    <circle cx="560" cy="30" r="1.3" opacity="0.8"/>
    <circle cx="690" cy="95" r="1.1" opacity="0.7"/>
    <circle cx="740" cy="160" r="0.9" opacity="0.5"/>
    <circle cx="40" cy="170" r="0.9" opacity="0.5"/>
    <circle cx="380" cy="140" r="0.8" opacity="0.5"/>
  </g>

  <!-- striped sun -->
  <g clip-path="url(#sunClip)" mask="url(#sunStripes)">
    <circle cx="400" cy="300" r="130" fill="url(#sun)"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 372 L90 318 L150 345 L230 290 L310 352 L360 330 L400 372 Z" fill="#3a0f2e" opacity="0.9"/>
  <path d="M400 372 L470 335 L540 300 L610 348 L680 315 L760 350 L800 330 L800 372 Z" fill="#3a0f2e" opacity="0.9"/>

  <!-- ground -->
  <rect y="372" width="800" height="228" fill="url(#ground)"/>
  <line x1="0" y1="372" x2="800" y2="372" stroke="#ff7a1a" stroke-width="2"/>

  <!-- perspective grid: verticals -->
  <g stroke="#ff2e88" stroke-width="1.4" opacity="0.7">
    <line x1="400" y1="372" x2="400" y2="600"/>
    <line x1="400" y1="372" x2="300" y2="600"/>
    <line x1="400" y1="372" x2="500" y2="600"/>
    <line x1="400" y1="372" x2="180" y2="600"/>
    <line x1="400" y1="372" x2="620" y2="600"/>
    <line x1="400" y1="372" x2="40" y2="600"/>
    <line x1="400" y1="372" x2="760" y2="600"/>
    <line x1="400" y1="372" x2="-140" y2="600"/>
    <line x1="400" y1="372" x2="940" y2="600"/>
    <line x1="400" y1="372" x2="-400" y2="600"/>
    <line x1="400" y1="372" x2="1200" y2="600"/>
  </g>

  <!-- perspective grid: horizontals, scrolling toward the viewer -->
  <g stroke="#ff2e88" stroke-width="1.4" opacity="0.7">
    <line x1="0" x2="800" y1="380" y2="380">
      <animate attributeName="y1" values="378;392" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="378;392" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="800" y1="392" y2="392">
      <animate attributeName="y1" values="392;414" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="392;414" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="800" y1="414" y2="414">
      <animate attributeName="y1" values="414;448" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="414;448" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="800" y1="448" y2="448">
      <animate attributeName="y1" values="448;500" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="448;500" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="800" y1="500" y2="500">
      <animate attributeName="y1" values="500;580" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="500;580" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="800" y1="580" y2="580">
      <animate attributeName="y1" values="580;700" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="580;700" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
